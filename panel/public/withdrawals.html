<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw — Nokos Panel</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="dot"></div> Nokos <b>Panel</b></div>
  
  <div class="userbox"><span id="userinfo">Admin</span> <button class="btn-logout" id="btnLogout">Keluar</button></div>
</div>
<div class="wrap">
<aside>
  <div class="nav-title">Menu</div>
  <ul>
    <li><a href="dashboard.html">📊 Dashboard</a></li>
    <li><a href="users.html">👥 Users</a></li>
    <li><a href="resellers.html">🏪 Reseller</a></li>
    <li><a href="orders.html">🧾 Order</a></li>
    <li><a href="orders-reseller.html">🤝 Order (Reseller)</a></li>
    <li><a href="deposits.html">💳 Deposit</a></li>
    <li><a href="withdrawals.html" class="active">🏧 Withdraw</a></li>
    <li><a href="settings.html">⚙️ Settings</a></li>
    <li><a href="keuangan.html">💰 Keuangan</a></li>
    <li><a href="qris-provider.html">💳 QRIS Provider</a></li>
    <li><a href="otp-provider.html">📱 OTP Provider</a></li>
  </ul>
</aside>
<main>
<div class="page active" id="withdrawals">
  <div class="toolbar"><div class="section-title">🏧 Permintaan Withdraw Reseller</div></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>Reseller</th><th>Nominal</th><th>Status</th><th>Catatan</th><th>Waktu</th><th>Aksi</th></tr></thead>
      <tbody id="tblWD"></tbody>
    </table>
  </div>
</div>
</main>
</div>
<script src="js/app.js"></script>
<script>
async function load() {
  const st = document.getElementById("fWD").value;
  const url = "/withdrawals" + (st ? "?status=" + st : "");
  const rows = await api(url) || [];
  const tb = document.getElementById("tblWD");
  tb.innerHTML = rows.map(w => `
    <tr>
      <td class="id-mono">#${w.id}</td>
      <td>${w.bot_username || "-"} <span class="id-mono">(user #${w.user_id})</span></td>
      <td>${w.amount}</td>
      <td>${statusBadge(w.status)}</td>
      <td>${w.note || "-"}</td>
      <td>${fmtDate(w.created_at)}</td>
      <td>
        <select onchange="chg(${w.id}, this.value)" class="btn btn-sm btn-outline" style="padding:2px 6px">
          <option value="PENDING" ${w.status==="PENDING"?"selected":""}>Pending</option>
          <option value="APPROVED" ${w.status==="APPROVED"?"selected":""}>Setuju</option>
          <option value="REJECTED" ${w.status==="REJECTED"?"selected":""}>Tolak</option>
        </select>
        <input id="note${w.id}" placeholder="catatan" style="width:90px;padding:2px 4px;font-size:0.75rem;margin-left:4px">
      </td>
    </tr>
  `).join("") || `<tr><td colspan="7" class="empty">Tidak ada withdraw.</td></tr>`;
}
async function chg(id, val) {
  const note = document.getElementById("note" + id).value;
  await api("/withdrawals/" + id + "/status", { method: "PATCH", body: JSON.stringify({ status: val, note }) });
  load();
}
document.getElementById("fWD").addEventListener("change", load);
load();
</script>
</body>
</html>
