<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit — Nokos Panel</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="dot"></div> Nokos <b>Panel</b></div>
  
  <div class="userbox"><span id="userinfo">Admin</span> <button class="btn-logout" id="btnLogout">Keluar</button></div>
</div>
<div class="wrap">
<aside>
  <div class="nav-title">Menu</div>
  <ul>
    <li><a href="dashboard.html">📊 Dashboard</a></li>
    <li><a href="users.html">👥 Users</a></li>
    <li><a href="resellers.html">🏪 Reseller</a></li>
    <li><a href="orders.html">🧾 Order</a></li>
    <li><a href="orders-reseller.html">🤝 Order (Reseller)</a></li>
    <li><a href="deposits.html" class="active">💳 Deposit</a></li>
    <li><a href="withdrawals.html">🏧 Withdraw</a></li>
    <li><a href="settings.html">⚙️ Settings</a></li>
    <li><a href="keuangan.html">💰 Keuangan</a></li>
    <li><a href="qris-provider.html">💳 QRIS Provider</a></li>
    <li><a href="otp-provider.html">📱 OTP Provider</a></li>
  </ul>
</aside>
<main>
<div class="page active" id="deposits">
  <div class="toolbar">
    <div class="section-title">💳 Konfirmasi Deposit</div>
    <select id="fDep" class="btn btn-outline" style="padding:4px 8px;font-size:0.8rem"><option value="">Semua status</option><option value="PENDING">Pending</option><option value="PAID">Terbayar</option><option value="EXPIRED">Kadaluarsa</option><option value="FAILED">Gagal</option></select>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>User</th><th>Nominal</th><th>Metode</th><th>Kode Unik</th><th>External ID</th><th>Status</th><th>Dibayar</th><th>Waktu</th><th>Aksi</th></tr></thead>
      <tbody id="tblDeposits"></tbody>
    </table>
  </div>
</div>
</main>
</div>
<script src="js/app.js"></script>
<script>
async function load() {
  const st = document.getElementById("fDep").value;
  const url = "/deposits" + (st ? "?status=" + st : "");
  const rows = await api(url) || [];
  const tb = document.getElementById("tblDeposits");
  tb.innerHTML = rows.map(d => `
    <tr>
      <td class="id-mono">#${d.id}</td>
      <td class="id-mono">${d.username || d.telegram_id}</td>
      <td>${d.amount}</td>
      <td>${d.method}</td>
      <td class="id-mono">${d.unique_code}</td>
      <td class="anchor">${d.external_id}</td>
      <td>${statusBadge(d.status)}</td>
      <td>${fmtDate(d.paid_at)}</td>
      <td>${fmtDate(d.created_at)}</td>
      <td>
        <select onchange="chg(${d.id}, this.value)" class="btn btn-sm btn-outline" style="padding:2px 6px">
          <option value="PENDING" ${d.status==="PENDING"?"selected":""}>Pending</option>
          <option value="PAID" ${d.status==="PAID"?"selected":""}>Tandai Bayar</option>
          <option value="EXPIRED" ${d.status==="EXPIRED"?"selected":""}>Kadaluarsa</option>
          <option value="FAILED" ${d.status==="FAILED"?"selected":""}>Gagal</option>
        </select>
      </td>
    </tr>
  `).join("") || `<tr><td colspan="10" class="empty">Tidak ada deposit.</td></tr>`;
}
async function chg(id, val) { await api("/deposits/" + id + "/status", { method: "PATCH", body: JSON.stringify({ status: val }) }); load(); }
document.getElementById("fDep").addEventListener("change", load);
load();
</script>
</body>
</html>
