<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Nokos Panel</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="dot"></div> Nokos <b>Panel</b></div>
  
  <div class="userbox"><span id="userinfo">Admin</span> <button class="btn-logout" id="btnLogout">Keluar</button></div>
</div>
<div class="wrap">
<aside>
  <div class="nav-title">Menu</div>
  <ul>
    <li><a href="dashboard.html">📊 Dashboard</a></li>
    <li><a href="users.html">👥 Users</a></li>
    <li><a href="resellers.html">🏪 Reseller</a></li>
    <li><a href="orders.html">🧾 Order</a></li>
    <li><a href="orders-reseller.html">🤝 Order (Reseller)</a></li>
    <li><a href="deposits.html">💳 Deposit</a></li>
    <li><a href="withdrawals.html">🏧 Withdraw</a></li>
    <li><a href="settings.html" class="active">⚙️ Settings</a></li>
    <li><a href="keuangan.html">💰 Keuangan</a></li>
    <li><a href="qris-provider.html">💳 QRIS Provider</a></li>
    <li><a href="otp-provider.html">📱 OTP Provider</a></li>
  </ul>
</aside>
<main>
<div class="page active" id="settings">
  <div class="toolbar"><div class="section-title">⚙️ Pengaturan Sistem</div></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Key</th><th>Nilai</th><th>Aksi</th></tr></thead>
      <tbody id="tblSettings"></tbody>
    </table>
  </div>
</div>
</main>
</div>
<script src="js/app.js"></script>
<script>
async function load() {
  const rows = await api("/settings") || [];
  const tb = document.getElementById("tblSettings");
  tb.innerHTML = rows.map(s => `
    <tr>
      <td class="id-mono">${s.key}</td>
      <td><input type="text" id="val${s.key}" value="${(s.value || "").replace(/"/g, "&quot;")}" style="width:220px;padding:4px 6px"></td>
      <td><button class="btn btn-sm btn-primary" onclick="save('${s.key}')">Simpan</button></td>
    </tr>
  `).join("") || `<tr><td colspan="3" class="empty">Belum ada pengaturan.</td></tr>`;
}
async function save(key) {
  const val = document.getElementById("val" + key).value;
  await api("/settings/" + key, { method: "PUT", body: JSON.stringify({ value: val }) });
  load();
}
load();
</script>
</body>
</html>
