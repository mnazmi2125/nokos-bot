<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — Nokos Panel</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="dot"></div> Nokos <b>Panel</b></div>
  
  <div class="userbox"><span id="userinfo">Admin</span> <button class="btn-logout" id="btnLogout">Keluar</button></div>
</div>
<div class="wrap">
<aside>
  <div class="nav-title">Menu</div>
  <ul>
    <li><a href="dashboard.html">📊 Dashboard</a></li>
    <li><a href="users.html" class="active">👥 Users</a></li>
    <li><a href="resellers.html">🏪 Reseller</a></li>
    <li><a href="orders.html">🧾 Order</a></li>
    <li><a href="orders-reseller.html">🤝 Order (Reseller)</a></li>
    <li><a href="deposits.html">💳 Deposit</a></li>
    <li><a href="withdrawals.html">🏧 Withdraw</a></li>
    <li><a href="settings.html">⚙️ Settings</a></li>
    <li><a href="keuangan.html">💰 Keuangan</a></li>
    <li><a href="qris-provider.html">💳 QRIS Provider</a></li>
    <li><a href="otp-provider.html">📱 OTP Provider</a></li>
  </ul>
</aside>
<main>
<div class="page active" id="users">
  <div class="toolbar">
    <div class="section-title">👥 Kelola User</div>
    <input type="text" id="q" placeholder="Cari username / nama / telegram ID..." style="padding:6px 10px;width:260px">
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>Telegram ID</th><th>Username</th><th>Balance</th><th>Status</th><th>Aksi</th><th>Edit Balance</th><th>Daftar</th></tr></thead>
      <tbody id="tblUsers"></tbody>
    </table>
  </div>
  <div class="toolbar" style="justify-content:flex-end">
    <span id="pageInfo" class="anchor"></span>
    <button class="btn btn-sm btn-outline" id="btnPrev">◀ Sebelumnya</button>
    <button class="btn btn-sm btn-outline" id="btnNext">Berikutnya ▶</button>
  </div>
</div>
</main>
</div>
<script src="js/app.js"></script>
<script>
const LIMIT = 20;
let q = "", offset = 0, total = 0;

async function load() {
  const d = await api(`/users?q=${encodeURIComponent(q)}&limit=${LIMIT}&offset=${offset}`);
  if (!d) return;
  total = d.total;
  const tb = document.getElementById("tblUsers");
  tb.innerHTML = (d.items || []).map(u => `
    <tr>
      <td class="id-mono">#${u.id}</td>
      <td class="id-mono">${u.telegram_id}</td>
      <td>${u.username || "-"}</td>
      <td>${u.balance}</td>
      <td>${u.is_banned ? '<span class="badge" style="background:#fee2e2;color:#991b1b">BANNED</span>' : '<span class="badge ACTIVE">AKTIF</span>'}</td>
      <td><button class="btn btn-sm btn-outline" onclick="toggleBan(${u.id}, ${u.is_banned})">${u.is_banned ? "Unban" : "Ban"}</button></td>
      <td style="white-space:nowrap"><input type="number" id="bal${u.id}" value="${u.raw_balance}" style="width:80px;padding:2px 4px"><button class="btn btn-sm btn-primary" onclick="updateBalance(${u.id}, '${u.username || "user #" + u.id}', ${u.raw_balance})" style="padding:2px 6px">Simpan</button></td>
      <td class="anchor">${fmtDate(u.created_at)}</td>
    </tr>
  `).join("") || `<tr><td colspan="8" class="empty">Tidak ada user cocok.</td></tr>`;
  const from = total === 0 ? 0 : offset + 1;
  const to = Math.min(offset + LIMIT, total);
  document.getElementById("pageInfo").textContent = `${from}–${to} dari ${total} user`;
  document.getElementById("btnPrev").disabled = offset === 0;
  document.getElementById("btnNext").disabled = offset + LIMIT >= total;
}

async function toggleBan(id, cur) {
  const ok = confirm(cur ? "Unban user ini?" : "Ban user ini? Mereka tidak bisa memakai bot.");
  if (!ok) return;
  await api("/users/" + id + "/ban", { method: "PATCH", body: JSON.stringify({ is_banned: !cur }) });
  load();
}

async function updateBalance(id, name, oldVal) {
  const el = document.getElementById("bal" + id);
  const val = Number(el.value);
  if (isNaN(val)) return;
  if (val === oldVal) return;
  const ok = confirm(`Ubah saldo ${name}?\n\nDari: Rp ${Number(oldVal).toLocaleString("id-ID")}\nMenjadi: Rp ${val.toLocaleString("id-ID")}`);
  if (!ok) { el.value = oldVal; return; }
  await api("/users/" + id + "/balance", { method: "PATCH", body: JSON.stringify({ balance: val }) });
  load();
}

let debounce;
document.getElementById("q").addEventListener("input", (e) => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { q = e.target.value.trim(); offset = 0; load(); }, 400);
});
document.getElementById("btnPrev").addEventListener("click", () => { offset = Math.max(0, offset - LIMIT); load(); });
document.getElementById("btnNext").addEventListener("click", () => { offset += LIMIT; load(); });

load();
</script>
</body>
</html>
